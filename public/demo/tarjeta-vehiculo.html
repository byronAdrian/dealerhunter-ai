<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Vehículo - Plantilla Concesionario</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="concesionario.css">
</head>
<body>

    <!-- Ejemplo de Tarjeta de Vehículo -->
    <article class="vehicle-card">
        
        <!-- Columna Izquierda: Imagen -->
        <div class="vc-image-wrapper" style="background-image: url('https://images.unsplash.com/photo-1544636331-e26879cd3d92?auto=format&fit=crop&w=800&q=80');">
            <div class="ribbon">!OFERTA DESCUENTO DEL 10%!</div>
            <div class="pill pill--top-right">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                SUV
            </div>
            <div class="pill pill--bottom-left">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22v-8a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v8"></path><path d="M12 22h4"></path><path d="M16 11V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4"></path><path d="M16 7h4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4"></path></svg>
                GASOLINA
            </div>
            <div class="eco-badge">C</div>
        </div>

        <!-- Columna Derecha: Contenido -->
        <div class="vc-content">
            <div class="vc-body">
                <div class="vc-header">
                    <div class="vc-brand">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/d/df/Lamborghini_Logo.svg/120px-Lamborghini_Logo.svg.png" alt="Lamborghini">
                        <span class="vc-brand-name">LAMBORGHINI</span>
                    </div>
                    <div class="vc-actions">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"></path><path d="M21 3l-6 6"></path><path d="M8 21H3v-5"></path><path d="M3 21l6-6"></path></svg>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    </div>
                </div>

                <h3 class="vc-title">URUS PERFORMANTE CON 666 CV</h3>
                
                <div class="vc-guarantee">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    GARANTÍA: 36 MESES
                </div>

                <div class="vc-specs">
                    <div class="spec-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        12/01/2025
                    </div>
                    <div class="spec-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        2.500 Km
                    </div>
                    <div class="spec-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="5" x2="12" y2="9"></line><line x1="12" y1="15" x2="12" y2="19"></line></svg>
                        Manual
                    </div>
                </div>
            </div>

            <!-- Footer con Precios -->
            <div class="vc-footer">
                <div class="vc-finance">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    FINANCIACIÓN A TU MEDIDA
                </div>
                <div class="vc-price-bar">
                    <div class="vc-price-old">ANTES 530.000€</div>
                    <div class="vc-price-new">AHORA 520.000€</div>
                </div>
            </div>
        </div>
    </article>

</body>
</html>
