<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Vehículo - Plantilla Concesionario</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="concesionario.css">
    <style>
        /* Estilos específicos para la página de detalle */
        body { padding: 0; }
        
        .nav-detalle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
        }
        .nav-brand { font-size: 1.5rem; font-weight: 900; letter-spacing: -1px; }
        .nav-brand span { color: var(--accent); }
        .nav-links { display: flex; gap: 2rem; font-weight: 600; font-size: 0.9rem; }
        .nav-links a { color: #fff; text-decoration: none; transition: color 0.2s; }
        .nav-links a:hover { color: var(--accent); }
        .nav-phone {
            background: var(--accent);
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-weight: 700;
            display: flex; align-items: center; gap: 8px;
        }

        .hero-detalle {
            position: relative;
            height: 85vh;
            background-image: linear-gradient(to top, var(--bg-color) 0%, rgba(26, 26, 26, 0.5) 50%, rgba(26, 26, 26, 0.8) 100%), url('https://images.unsplash.com/photo-1544636331-e26879cd3d92?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 4rem 5%;
        }

        .hero-content {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: flex-end;
            gap: 2rem;
        }

        .hero-info {
            flex: 1;
        }
        
        .breadcrumbs {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            gap: 8px;
        }
        .breadcrumbs span { color: #fff; }

        .brand-logo-large {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1rem;
        }
        .brand-logo-large img { height: 40px; }
        .brand-logo-large h2 { margin: 0; font-size: 1.2rem; color: var(--text-secondary); letter-spacing: 2px; }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0 0 1.5rem 0;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .hero-badges {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .hero-sidebar {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .thumbnails {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .thumb {
            aspect-ratio: 4/3;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: border 0.2s;
        }
        .thumb:hover { border-color: var(--accent); }
        .thumb.more {
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }

        .price-box {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .price-box-old {
            background: #111;
            padding: 1rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: line-through;
        }
        .price-box-new {
            background: var(--accent);
            padding: 1.5rem;
            text-align: center;
            color: #fff;
            font-size: 2.2rem;
            font-weight: 900;
        }
        .price-box-finance {
            padding: 1rem;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

    </style>
</head>
<body>

    <!-- Navegación -->
    <nav class="nav-detalle">
        <div class="nav-brand">AUREX <span>MOTORS</span></div>
        <div class="nav-links">
            <a href="#">INICIO</a>
            <a href="#">VEHÍCULOS</a>
            <a href="#">NOSOTROS</a>
            <a href="#">CONTACTO</a>
        </div>
        <div class="nav-phone">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            91 000 00 00
        </div>
    </nav>

    <!-- Hero Detalle -->
    <header class="hero-detalle">
        <div class="hero-content">
            
            <div class="hero-info">
                <div class="breadcrumbs">
                    Inicio / Vehículos / Lamborghini / <span>Urus Performante</span>
                </div>
                
                <div class="brand-logo-large">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/d/df/Lamborghini_Logo.svg/120px-Lamborghini_Logo.svg.png" alt="Lamborghini">
                    <h2>LAMBORGHINI</h2>
                </div>

                <h1 class="hero-title">URUS PERFORMANTE<br>CON 666 CV</h1>

                <div class="hero-badges">
                    <div class="pill" style="position: relative; top: 0; left: 0;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                        SUV
                    </div>
                    <div class="pill" style="position: relative; top: 0; left: 0;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22v-8a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v8"></path><path d="M12 22h4"></path><path d="M16 11V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4"></path><path d="M16 7h4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4"></path></svg>
                        GASOLINA
                    </div>
                    <div class="vc-guarantee" style="margin: 0;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        GARANTÍA: 36 MESES
                    </div>
                </div>
            </div>

            <div class="hero-sidebar">
                <div class="thumbnails">
                    <div class="thumb" style="background-image: url('https://images.unsplash.com/photo-1544636331-e26879cd3d92?auto=format&fit=crop&w=300&q=80');"></div>
                    <div class="thumb" style="background-image: url('https://images.unsplash.com/photo-1627454819213-92f76783be31?auto=format&fit=crop&w=300&q=80');"></div>
                    <div class="thumb more">+24</div>
                </div>

                <div class="price-box">
                    <div class="price-box-old">ANTES 530.000€</div>
                    <div class="price-box-new">AHORA 520.000€</div>
                    <div class="price-box-finance">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                        FINANCIACIÓN A TU MEDIDA
                    </div>
                </div>
            </div>

        </div>
    </header>

</body>
</html>
